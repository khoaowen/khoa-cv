name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, generate PDFs, deploy to Cloudflare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Same complete contract as CI; all stages finish against this checkout
      # before Wrangler is allowed to upload dist/.
      - name: Build and validate release candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npm run build:all
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Deploy to Cloudflare Workers (static assets)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Reads wrangler.jsonc: deploys the ./dist assets as the "khoa-cv" Worker.
          command: deploy
